name: Windows verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller
      - name: Test, build and smoke-test EXE
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Python python -Build
      - name: Save unsigned preview build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VP-Autoplayer-unsigned-windows
          path: dist/VP Autoplayer.exe
          if-no-files-found: error
          retention-days: 7

